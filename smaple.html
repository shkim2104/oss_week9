<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Week 9 Sample - Fetch GET</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 680px; margin: 42px auto; padding: 0 20px; color: #202938; }
    h1 { margin-bottom: 6px; }
    p { color: #596579; }
    button { padding: 10px 18px; border: 0; border-radius: 7px; color: white; background: #2459bd; cursor: pointer; }
    button:disabled { opacity: .5; cursor: wait; }
    #status { min-height: 24px; margin: 16px 0; }
    li { padding: 11px 4px; border-bottom: 1px solid #e2e8f0; }
    small { display: block; color: #5c687b; }
  </style>
</head>
<body>
  <h1>Student Viewer (Sample)</h1>
  <p>GET + async/await + JSON + DOM. This is a read-only study sample.</p>
  <button id="loadBtn" type="button">데이터 가져오기 (GET)</button>
  <p id="status" role="status">버튼을 클릭하세요.</p>
  <ul id="studentList"></ul>
  <script>
    const API_URL = "https://jsonplaceholder.typicode.com/users";
    const button = document.querySelector("#loadBtn");
    const status = document.querySelector("#status");
    const list = document.querySelector("#studentList");

    async function loadStudents() {
      button.disabled = true;
      status.textContent = "데이터를 가져오는 중...";
      list.replaceChildren();

      try {
        const response = await fetch(API_URL);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const students = await response.json();

        students.forEach(student => {
          const li = document.createElement("li");
          li.textContent = student.name;
          const email = document.createElement("small");
          email.textContent = student.email;
          li.appendChild(email);
          list.appendChild(li);
        });
        status.textContent = `${students.length}개 항목을 가져왔습니다.`;
      } catch (error) {
        status.textContent = `조회 실패: ${error.message}`;
      } finally {
        button.disabled = false;
      }
    }

    button.addEventListener("click", loadStudents);
  </script>
</body>
</html>
