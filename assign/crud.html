<!DOCTYPE html>

<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title></title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="">
    </head>

    <body>
        <form id="form">
            <input id="name" placeholder="가게 이름">

                <select id="category">
                    <option value="">종류 선택</option>
                    <option>한식</option>
                    <option>중식</option>
                    <option>일식</option>
                    <option>양식</option>
                    <option>카페</option>
                </select>

            <input id="location" placeholder="위치 (예: 포항 양덕)">
            <input id="menu" placeholder="대표 메뉴">
            <input id="rating" type="number" placeholder="평점 (1~5)">

            <button type="submit" id="submitBtn">추가</button>

        </form>

        <p id="status"></p>
            <table>
            
                <thead>
                    <tr>
                        <th>이름</th>
                        <th>종류</th>
                        <th>위치</th>
                        <th>메뉴</th>
                        <th>평점</th>
                        <th>삭제</th>
                    </tr>
                </thead>

                <tbody id="list"></tbody>
            </table>


        <script src="crud.js" async defer></script>
    </body>
</html>
